[preferred]
default=hyprland;gtk;
# Pin screen capture to the hyprland backend explicitly. gnome.portal and
# kde.portal also declare org.freedesktop.impl.portal.ScreenCast, and both are
# installed here; without these lines the choice depends on backend ordering,
# which can change across updates and silently break screen sharing.
org.freedesktop.impl.portal.ScreenCast=hyprland;
org.freedesktop.impl.portal.Screenshot=hyprland;
org.freedesktop.impl.portal.FileChooser=gtk;
