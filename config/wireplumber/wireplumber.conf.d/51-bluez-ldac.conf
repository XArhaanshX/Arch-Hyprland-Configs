# Bluetooth audio tuning for the WH-1000XM6.
#
# LDAC defaults to "auto", which drops bitrate when the link looks marginal.
# "hq" pins it to 990/909 kbps — the best the codec does. If you ever get
# stuttering when you walk away from the laptop, change quality back to
# "auto" (or "sq") and restart wireplumber.
#
# Also enables SBC-XQ as a better fallback, and hardware volume so the
# headphone's own volume buttons track the system volume.

monitor.bluez.properties = {
  bluez5.enable-sbc-xq   = true
  bluez5.enable-msbc     = true
  bluez5.enable-hw-volume = true
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hsp_hs hsp_ag hfp_hf hfp_ag ]
  bluez5.codecs = [ ldac aac sbc_xq sbc ]
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        # "hq" (990kbps) caused dropouts at stream start; "auto" adapts the
        # bitrate to link conditions, which is the pre-existing behaviour.
        bluez5.a2dp.ldac.quality = "auto"
        bluez5.auto-connect = [ a2dp_sink hfp_hf hsp_hs ]
      }
    }
  }
]
