# Material You theme for yazi, generated by matugen.
# Edit ~/.config/matugen/templates/yazi/theme.toml, not this file.

[mgr]
cwd = { fg = "{{colors.tertiary.default.hex}}" }

hovered         = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
preview_hovered = { underline = true }

find_keyword  = { fg = "{{colors.primary.default.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.tertiary.default.hex}}", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_cut      = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

count_copied   = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
count_cut      = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

border_symbol = "│"
border_style  = { fg = "{{colors.outline_variant.default.hex}}" }

[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
select_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
unset_main  = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
unset_alt   = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[status]
progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[pick]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.tertiary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}" }

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border = { fg = "{{colors.primary.default.hex}}" }

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = {}
hovered = { fg = "{{colors.primary.default.hex}}", underline = true }

[which]
mask            = { bg = "{{colors.surface_container.default.hex}}" }
cand            = { fg = "{{colors.tertiary.default.hex}}" }
rest            = { fg = "{{colors.outline.default.hex}}" }
desc            = { fg = "{{colors.primary.default.hex}}" }
separator       = "  "
separator_style = { fg = "{{colors.outline_variant.default.hex}}" }

[help]
on      = { fg = "{{colors.tertiary.default.hex}}" }
run     = { fg = "{{colors.primary.default.hex}}" }
hovered = { reversed = true, bold = true }
footer  = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.on_surface.default.hex}}" }

[notify]
title_info  = { fg = "{{colors.tertiary.default.hex}}" }
title_warn  = { fg = "{{colors.secondary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[filetype]
rules = [
	{ mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },
	{ mime = "{audio,video}/*", fg = "{{colors.secondary.default.hex}}" },
	{ mime = "application/{,g}zip", fg = "{{colors.primary_fixed_dim.default.hex}}" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "{{colors.primary_fixed_dim.default.hex}}" },
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "{{colors.error.default.hex}}" },
	{ url = "*", is = "orphan", bg = "{{colors.error_container.default.hex}}" },
	{ url = "*", is = "exec", fg = "{{colors.primary.default.hex}}" },
	{ url = "*/", fg = "{{colors.primary.default.hex}}" },
]
